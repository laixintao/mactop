[project]
name = "mactop"
version = "0.1.11"
description = "Htop for macbook."
authors = [{ name = "laixintao", email = "laixintaoo@gmail.com" }]
readme = "README.md"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10,<4.0"
dependencies = [
    "textual>=0.35.1,<0.36.0",
    "click>=8.1.7,<9.0.0",
    "psutil>=5.9.5,<6.0.0",
]

[project.scripts]
mactop = "mactop.main:main"

[dependency-groups]
dev = [
    "pytest>=7.4.1,<8.0.0",
]

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
